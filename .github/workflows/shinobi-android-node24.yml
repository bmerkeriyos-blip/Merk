name: Shinobi Android CI (Node 24)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
  JAVA_TOOL_OPTIONS: "-Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2"

jobs:
  build-and-test:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up JDK 21 (actions/setup-java@v5)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Accept Android SDK Licenses & Ensure Platform 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MGR="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare & verify google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \t\r\n' | head -c 1)"
            if [ "$TRIMMED" = "{" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing! Commit app/google-services.json or set the GOOGLE_SERVICES_JSON GitHub Actions secret so Firebase AI and Google Sign-In work."
            exit 1
          fi
          if ! grep -q "com.aistudio.shinobiplanner.kxmpzq" app/google-services.json; then
            echo "::error::app/google-services.json does not configure package com.aistudio.shinobiplanner.kxmpzq."
            exit 1
          fi

      - name: Assemble Debug APK
        run: gradle assembleDebug --max-workers=2 --no-configuration-cache -Pkotlin.compiler.execution.strategy=daemon -Pksp.incremental=false -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" --console=plain

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --max-workers=1 --no-configuration-cache -Pkotlin.compiler.execution.strategy=daemon -Pksp.incremental=false -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" --console=plain

      - name: Upload Unit Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report-node24
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: shinobi-planner-debug-apk-node24
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
