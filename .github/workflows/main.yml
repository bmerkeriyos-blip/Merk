name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

jobs:
  build-debug:
    name: Build Shinobi Planner Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Robolectric SDKs
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-sdk-v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Accept Android SDK Licenses & Ensure Platform 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MGR="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare & verify google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \t\r\n' | head -c 1)"
            if [ "$TRIMMED" = "{" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing! Commit app/google-services.json or set the GOOGLE_SERVICES_JSON GitHub Actions secret so Firebase AI and Google Sign-In work."
            exit 1
          fi
          if ! grep -q "com.aistudio.shinobiplanner.kxmpzq" app/google-services.json; then
            echo "::error::app/google-services.json does not configure package com.aistudio.shinobiplanner.kxmpzq."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --max-workers=2 --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process -Pksp.incremental=false -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8" --console=plain

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --max-workers=1 --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process -Pksp.incremental=false -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8" -Drobolectric.dependency.repo.url=https://repo1.maven.org/maven2 --console=plain

      - name: Print Unit Test Failure Summary
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not files:
              print("No TEST-*.xml files were generated.")
          for path in files:
              root = ET.parse(path).getroot()
              for tc in root.findall("testcase"):
                  for tag in ("failure", "error"):
                      node = tc.find(tag)
                      if node is not None:
                          print(f"FAILED: {tc.attrib.get('classname')} :: {tc.attrib.get('name')}")
                          print(node.attrib.get("message", ""))
                          print(node.text or "")
          PY

      - name: Upload Unit Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Shinobi-Planner-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
